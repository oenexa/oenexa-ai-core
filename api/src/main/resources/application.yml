server:
  port: ${SERVER_PORT:8110}

spring:
  application:
    name: oenexa-ai-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OENEXA Module Feature Toggles
oenexa:
  redis:
    enabled: false
  kafka:
    enabled: false
  elasticsearch:
    enabled: false
  security:
    sso:
      enforce: ${OENEXA_SSO_ENFORCE:false}
      trust-gateway-headers: ${OENEXA_TRUST_GATEWAY_HEADERS:false}
