spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/oenexa_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:oenexa}
    password: ${SPRING_DATASOURCE_PASSWORD:oenexa_secret}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}

oenexa:
  redis:
    enabled: ${OENEXA_REDIS_ENABLED:true}
  kafka:
    enabled: ${OENEXA_KAFKA_ENABLED:false}
  elasticsearch:
    enabled: ${OENEXA_ELASTICSEARCH_ENABLED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    elasticsearch:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false

