spring:
  datasource:
    url: jdbc:h2:mem:oenexa_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
    diskspace:
      enabled: true
    db:
      enabled: true

oenexa:
  redis:
    enabled: false
  kafka:
    enabled: false
  elasticsearch:
    enabled: false
