spring:
  application:
    name: oenexa-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oenexa}
    username: ${DB_USER:oenexa}
    password: ${DB_PASSWORD:oenexa}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}

oenexa:
  auth:
    # No default on purpose: the app refuses to start without a real secret (min 32 bytes).
    jwt-secret: ${OENEXA_JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P7D
  chat:
    provider: ${OENEXA_LLM_PROVIDER:echo}   # echo | spring-ai
    token-budget: 24000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  shutdown: graceful
