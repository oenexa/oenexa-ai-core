services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (with Flyway auto-migration)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: oenexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oenexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oenexa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oenexa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oenexa} -d ${POSTGRES_DB:-oenexa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oenexa-net

  # ----------------------------------------------------------------------------
  # Redis Cache & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oenexa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-net

  # ----------------------------------------------------------------------------
  # OENEXA AI Engineer - Spring Boot 4 Backend (Java 25)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: oenexa/ai-engineer-backend:latest
    container_name: oenexa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oenexa_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-oenexa}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-oenexa_secret}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - OENEXA_REDIS_ENABLED=true
      - OENEXA_KAFKA_ENABLED=false
      - OENEXA_ELASTICSEARCH_ENABLED=false
      - OENEXA_JWT_SECRET=${OENEXA_JWT_SECRET:-oenexa-ai-engineer-jwt-secret-key-32bytes-min-sample}
      - OENEXA_LLM_PROVIDER=${OENEXA_LLM_PROVIDER:-echo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - oenexa-net

  # ----------------------------------------------------------------------------
  # OENEXA AI Engineer - React / Vite Frontend (Nginx SPA + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../oenexa-ai-engineer-frontend
      dockerfile: Dockerfile
    image: oenexa/ai-engineer-frontend:latest
    container_name: oenexa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - oenexa-net

volumes:
  postgres_data:
    name: oenexa_postgres_data
  redis_data:
    name: oenexa_redis_data

networks:
  oenexa-net:
    name: oenexa-network
    driver: bridge
