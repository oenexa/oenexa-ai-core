name: OENEXA AI Core CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-core)
        uses: actions/checkout@v4

      - name: Set up Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Verification Test Suite
        run: ./gradlew test --no-daemon

      - name: Build Executable BootJar (:api:bootJar)
        run: ./gradlew :api:bootJar --no-daemon

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENEXA AI Core Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        if: env.SSH_KEY != ''
        with:
          host: ${{ secrets.SERVER_HOST || '62.210.92.60' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "Deploying OENEXA AI Core on VPS (62.210.92.60)..."
            if [ -d "/opt/oenexa/src/oenexa-ai-core" ]; then
              cd /opt/oenexa/src/oenexa-ai-core
              git fetch origin main
              git checkout -B main origin/main
              git reset --hard origin/main
            fi
            cd /opt/oenexa
            docker compose build oenexa-ai-core
            docker compose up -d --no-deps oenexa-ai-core
            docker compose ps oenexa-ai-core

      - name: Report missing SSH secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        if: env.SSH_KEY == ''
        run: echo "::warning::SERVER_SSH_KEY secret is not configured in this repository. Skipping automatic SSH deployment to VPS."
