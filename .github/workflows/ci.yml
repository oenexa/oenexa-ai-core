name: OENEXA AI Core CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Core
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-core)
        uses: actions/checkout@v4

      - name: Set up Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Verification Test Suite
        run: ./gradlew test --no-daemon

      - name: Build Executable BootJar (:api:bootJar)
        run: ./gradlew :api:bootJar --no-daemon

  build-and-push:
    needs: build-and-test
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENEXA AI Core Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy OENEXA AI Core directly on VPS
        run: |
          set -e
          echo "Deploying OENEXA AI Core on VPS (62.210.92.60)..."
          if [ -d "/opt/oenexa/src/oenexa-ai-core" ]; then
            cd /opt/oenexa/src/oenexa-ai-core
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
          fi
          cd /opt/oenexa
          docker compose -f docker-compose.prod.yml build oenexa-ai-core
          docker compose -f docker-compose.prod.yml up -d --no-deps oenexa-ai-core
          docker compose -f docker-compose.prod.yml ps oenexa-ai-core
