name: OENEXA AI Core CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-core)
        uses: actions/checkout@v4

      - name: Set up Java 27 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Zero-Mock Verification Test Suite
        run: ./gradlew test --no-daemon

      - name: Build Executable BootJar (:api:bootJar)
        run: ./gradlew :api:bootJar --no-daemon

      - name: Build Container Image (oenexa/ai-core:latest)
        run: docker build -t oenexa/ai-core:latest -f Dockerfile .
