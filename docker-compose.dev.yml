services:
  postgres:
    image: postgres:15-alpine
    container_name: oenexa-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oenexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oenexa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oenexa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oenexa} -d ${POSTGRES_DB:-oenexa_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - oenexa-net-dev

  redis:
    image: redis:7-alpine
    container_name: oenexa-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - oenexa-net-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.fast
    image: oenexa/ai-engineer-backend:dev
    container_name: oenexa-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oenexa_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-oenexa}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-oenexa_secret}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - OENEXA_REDIS_ENABLED=true
      - OENEXA_KAFKA_ENABLED=false
      - OENEXA_ELASTICSEARCH_ENABLED=false
      - OENEXA_JWT_SECRET=${OENEXA_JWT_SECRET:-oenexa-ai-engineer-jwt-secret-key-32bytes-min-sample}
      - OENEXA_LLM_PROVIDER=${OENEXA_LLM_PROVIDER:-echo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - oenexa-net-dev

  frontend:
    image: node:22-alpine
    container_name: oenexa-frontend-dev
    working_dir: /app
    volumes:
      - ../oenexa-ai-engineer-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080/api
    networks:
      - oenexa-net-dev

volumes:
  postgres_data_dev:
    name: oenexa_postgres_data_dev
  frontend_node_modules:
    name: oenexa_frontend_node_modules

networks:
  oenexa-net-dev:
    name: oenexa-network-dev
    driver: bridge
